# Paste into the Forge site's Nginx config (Site → Edit Nginx Configuration),
# inside the `server { listen 443 ... }` block, REPLACING Forge's default
# `location / { try_files ... /index.php?$query_string; }` and the
# `location ~ \.php$ { ... }` block (static site, no PHP).

# Service worker + manifest + HTML must never be cached, or updates stall.
location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /index.html           { add_header Cache-Control "no-cache"; }

# Vite output is content-hashed – cache forever.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
