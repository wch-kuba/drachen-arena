# Forge site → Edit Nginx Configuration.
# Replace Forge's default `location / { try_files $uri $uri/ =404; }` with this.
# Uses `expires` (not add_header) so the server-level security headers
# (X-Frame-Options, nosniff) are still inherited.

# Service worker, manifest, HTML: always revalidate, or updates stall.
location = /sw.js                { expires -1; try_files $uri =404; }
location = /manifest.webmanifest { expires -1; try_files $uri =404; }
location = /index.html           { expires -1; }

# Vite output is content-hashed – cache for a year.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
